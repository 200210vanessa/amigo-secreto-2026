<script>

const SUPABASE_URL =
"https://opnaqgzedpgdhhxjoogq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_t-6SaHoNi3kdm2UmgUTl-Q_luhD1x5U";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function consultar() {

    const nombre =
        document.getElementById("persona").value;

    const boton =
        document.getElementById("boton");

    const error =
        document.getElementById("error");

    const resultado =
        document.getElementById("result");

    const warning =
        document.getElementById("warning");

    error.style.display = "none";
    resultado.style.display = "none";
    warning.style.display = "none";


    if (!nombre) {

        mostrarError(
            "Selecciona tu nombre."
        );

        return;
    }


    boton.disabled = true;

    boton.textContent =
        "Consultando...";


    try {

        const { data, error: supabaseError } =
            await supabaseClient.rpc(
                "consultar_amigo",
                {
                    p_name: nombre
                }
            );


        if (supabaseError) {
            throw supabaseError;
        }


        if (!data || data.length === 0) {

            mostrarError(
                "No se encontró el participante."
            );

            boton.disabled = false;

            boton.textContent =
                "🎁 DESCUBRIR MI AMIGO SECRETO";

            return;
        }


        const persona = data[0];


        if (
            persona.amigo_secreto ===
            "YA CONSULTADO"
        ) {

            warning.style.display =
                "block";

            boton.disabled = true;

            boton.textContent =
                "Ya consultado";

            return;
        }


        document.getElementById(
            "nombreResultado"
        ).textContent =
            persona.amigo_secreto;


        resultado.style.display =
            "block";


        boton.disabled = true;

        boton.textContent =
            "✅ Resultado consultado";

    }

    catch (e) {

        console.error(e);

        mostrarError(
            e.message ||
            "No fue posible consultar el resultado."
        );

        boton.disabled = false;

        boton.textContent =
            "🎁 DESCUBRIR MI AMIGO SECRETO";
    }

}


function mostrarError(texto) {

    const error =
        document.getElementById("error");

    error.textContent =
        texto;

    error.style.display =
        "block";
}

</script>
